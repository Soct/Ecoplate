  <text class="caps green" x="1100" y="42" text-anchor="middle">PARCOURS · PROJETS · COMPÉTENCES · PROGRESSION</text>

  <path class="branch green-line" d="M890 625 C790 600 760 310 600 280"/><path class="branch orange-line" d="M890 690 C790 690 760 680 600 680"/>
  <path class="branch orange-line" d="M1310 625 C1410 600 1440 310 1600 280"/><path class="branch green-line" d="M1310 690 C1410 690 1440 680 1600 680"/><path class="branch gold-line" d="M1100 815 C1100 900 1100 930 1100 970"/><path class="branch green-line" d="M1100 1380 C1100 1430 1100 1450 1100 1485"/>

  <g filter="url(#shadow)" transform="translate(200 0)"><rect class="green" x="690" y="555" width="420" height="260" rx="24"/><text class="caps white" x="900" y="600" text-anchor="middle">MON PARCOURS</text><text class="title white" x="900" y="647" text-anchor="middle">Construire une IA utile</text><text class="body white" x="900" y="690" text-anchor="middle">Partir d’un besoin, pas d’un modèle</text><text class="body white" x="900" y="724" text-anchor="middle">Comparer avec des mesures vérifiables</text><text class="body white" x="900" y="758" text-anchor="middle">Déployer, surveiller et expliquer les limites</text><text class="tiny" fill="#dcebd5" x="900" y="790" text-anchor="middle">13 étapes validées · 8 projets documentés · 1 projet personnel</text></g>

  <a href="rapport-conduite-projet.pdf" aria-label="Consulter le rapport EcoPlate Edge"><g filter="url(#shadow)"><rect class="node orange-stroke" x="55" y="75" width="620" height="405" rx="16"/><rect class="pale-orange" x="55" y="75" width="620" height="62" rx="16"/><text class="caps orange" x="88" y="103">PROJET PERSONNEL TECHNIQUE</text><text class="head ink" x="88" y="126">EcoPlate Edge : de la photo au repère climatique</text><text class="body ink" x="88" y="174">Le besoin</text><text class="small muted" x="210" y="174">Donner un premier repère sans envoyer la photo à un serveur.</text><text class="body ink" x="88" y="215">Mon travail</text><text class="small muted" x="210" y="215">Cadrage, modèle vision, interface, tests et documentation.</text><text class="body ink" x="88" y="256">Mon choix</text><text class="small muted" x="210" y="256">EfficientNet-Lite0 exécuté localement dans le navigateur.</text><text class="body ink" x="88" y="297">La preuve</text><text class="small muted" x="210" y="297">54,27 % top-1 et 82,95 % top-3 sur 25 250 images.</text><text class="body ink" x="88" y="338">La prudence</text><text class="small muted" x="210" y="338">Correction humaine et réponse « ? » lorsque le doute reste fort.</text><text class="body ink" x="88" y="379">La limite</text><text class="small muted" x="210" y="379">Le résultat sur des photos prises en usage réel reste à mesurer.</text><text class="small orange" x="88" y="444">Voir le rapport, les choix techniques et les résultats ↗</text></g></a>

  <a href="../annexes/competences.html" aria-label="Consulter les compétences techniques et leurs réalisations"><g filter="url(#shadow)"><rect class="node green-stroke" x="40" y="505" width="635" height="390" rx="16"/><rect class="pale-green" x="40" y="505" width="635" height="62" rx="16"/><text class="caps green" x="73" y="533">CE QUE J’AI MIS EN PRATIQUE</text><text class="head ink" x="73" y="556">Compétences reliées à des réalisations</text><text class="body ink" x="73" y="607">Cadrer un besoin IA</text><text class="scope green" x="630" y="607" text-anchor="end">BESOINS · RISQUES</text><text class="small muted" x="73" y="633">Fashion-Insta : besoins, coûts, risques et décision Go / No-Go.</text><text class="body ink" x="73" y="677">Déployer et suivre un modèle</text><text class="scope green" x="630" y="677" text-anchor="end">API · CI · SUIVI</text><text class="small muted" x="73" y="703">Home Credit : MLflow, API, conteneur, CI et suivi de dérive.</text><text class="body ink" x="73" y="747">Évaluer une chaîne IA</text><text class="scope green" x="630" y="747" text-anchor="end">MÉTRIQUES · ERREURS</text><text class="small muted" x="73" y="773">OpenAgenda : recherche et génération mesurées séparément.</text><text class="body ink" x="73" y="817">Faire tourner un modèle côté client</text><text class="scope green" x="630" y="817" text-anchor="end">WASM · TESTS</text><text class="small muted" x="73" y="843">EcoPlate : TypeScript, MediaPipe, WebAssembly et tests.</text><text class="tiny green" x="73" y="877">Pratiques illustrées par les projets · Voir le détail ↗</text></g></a>

  <a href="../annexes/journal-decisions.html" aria-label="Consulter l’évolution de ma perception du métier"><g filter="url(#shadow)"><rect class="node orange-stroke" x="1125" y="75" width="620" height="390" rx="16"/><rect class="pale-orange" x="1125" y="75" width="620" height="62" rx="16"/><text class="caps orange" x="1158" y="103">MON REGARD SUR LE MÉTIER A CHANGÉ</text><text class="head ink" x="1158" y="126">Avant : faire fonctionner un bon modèle</text><text class="body ink" x="1158" y="180">Aujourd’hui, je commence par demander :</text><text class="small muted" x="1158" y="216">Quel problème doit-on vraiment résoudre ?</text><text class="small muted" x="1158" y="247">Quelles données permettent de vérifier la réponse ?</text><text class="small muted" x="1158" y="278">Quand le système doit-il refuser de répondre ?</text><text class="small muted" x="1158" y="309">Comment l’utilisateur peut-il corriger le résultat ?</text><text class="small muted" x="1158" y="340">Que faudra-t-il surveiller après le déploiement ?</text><text class="body ink" x="1158" y="385">Mon rôle : rendre les compromis lisibles, pas seulement coder.</text><text class="small orange" x="1158" y="433">Voir les décisions qui ont construit cette vision ↗</text></g></a>

  <a href="../annexes/journal-decisions.html" aria-label="Consulter les exemples de compétences humaines"><g filter="url(#shadow)"><rect class="node green-stroke" x="1125" y="505" width="635" height="390" rx="16"/><rect class="pale-green" x="1125" y="505" width="635" height="62" rx="16"/><text class="caps green" x="1158" y="533">COMPÉTENCES HUMAINES EN ACTION</text><text class="head ink" x="1158" y="556">Des comportements observables, pas des étiquettes</text><text class="body ink" x="1158" y="607">Esprit critique</text><text class="small muted" x="1158" y="633">J’ai conservé et expliqué les résultats négatifs de BrainScanAI.</text><text class="body ink" x="1158" y="677">Autonomie</text><text class="small muted" x="1158" y="703">J’ai mené EcoPlate du cadrage au déploiement documenté.</text><text class="body ink" x="1158" y="747">Vulgarisation</text><text class="small muted" x="1158" y="773">J’ai séparé prédiction, correction et repère climatique indicatif.</text><text class="body ink" x="1158" y="817">Prise de décision</text><text class="small muted" x="1158" y="843">J’ai retiré SlimSAM faute de gain mesuré au lieu de le promettre.</text><text class="tiny green" x="1158" y="877">Chaque qualité renvoie à une décision ou à un livrable vérifiable ↗</text></g></a>

  <a href="../annexes/evaluation.html" aria-label="Consulter le bilan et les prochains objectifs"><g filter="url(#shadow)"><rect class="node gold-stroke" x="535" y="970" width="730" height="410" rx="16"/><rect class="pale-gold" x="535" y="970" width="730" height="62" rx="16"/><text class="caps gold" x="572" y="998">AVEC DU RECUL</text><text class="head ink" x="572" y="1021">Ce que je changerais dans ma méthode</text><text class="body ink" x="572" y="1078">Collecter les données réelles avant de finaliser l’interface</text><text class="small muted" x="572" y="1107">Les erreurs terrain auraient guidé le mapping et le choix du modèle.</text><text class="body ink" x="572" y="1161">Suivre le temps réellement passé</text><text class="small muted" x="572" y="1190">Je pourrais comparer les 26–40 h prévues au coût réel du POC.</text><text class="body ink" x="572" y="1244">Tester la compréhension avec des utilisateurs</text><text class="small muted" x="572" y="1273">Confiance, correction et score A–E doivent être compris sans oral.</text><text class="body ink" x="572" y="1327">Prochaine preuve : 30 photos annotées sur ordinateur et téléphone</text><text class="tiny gold" x="572" y="1360">Puis approfondir le suivi MLOps, l’accessibilité et la validation métier ↗</text></g></a>

