<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1880" viewBox="0 0 2200 1880" role="img" aria-labelledby="title desc">
  <title id="title">Carte conceptuelle de mon parcours d’AI Engineer</title>
  <desc id="desc">Une carte à sept branches relie mes projets aux compétences démontrées, aux preuves disponibles, à mon évolution professionnelle et à mes prochains objectifs.</desc>
  <defs>
    <style>
      .bg{fill:#f5f1e8}.branch{fill:none;stroke-width:5;stroke-linecap:round}.green-line{stroke:#2f6b4f}.orange-line{stroke:#cf5a35}.gold-line{stroke:#a27a19}.node{fill:#fffdf8;stroke-width:2}.green-stroke{stroke:#2f6b4f}.orange-stroke{stroke:#cf5a35}.gold-stroke{stroke:#a27a19}.green{fill:#235b42}.orange{fill:#c95330}.gold{fill:#8b6813}.pale-green{fill:#e6efe8}.pale-orange{fill:#f8e9e1}.pale-gold{fill:#f4edcf}.ink{fill:#17231c}.white{fill:#fff}.muted{fill:#526158}.title{font:700 30px Georgia,serif}.head{font:700 22px Georgia,serif}.body{font:17px system-ui,sans-serif}.small{font:15px system-ui,sans-serif}.tiny{font:14px system-ui,sans-serif}.caps{font:700 13px system-ui,sans-serif;letter-spacing:1.5px}.scope{font:700 14px system-ui,sans-serif}a:hover .node,a:focus .node{stroke-width:5}a[href="../annexes/journal-decisions.html"]{transform:translate(400px,0)}a[href="../annexes/evaluation.html"]{transform:translate(200px,0)}a[data-column="2"]{transform:translate(110px,0)}a[data-column="3"]{transform:translate(210px,0)}a[data-column="4"]{transform:translate(320px,0)}
    </style>
