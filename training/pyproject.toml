[project]
name = "ecoplate-edge-training"
version = "0.1.0"
description = "Entraînement et export Edge AI pour EcoPlate Edge"
requires-python = ">=3.10,<3.14"
dependencies = []

[dependency-groups]
data = [
    "datasets>=4.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "requests>=2.32",
    "urllib3>=2.0",
]
training = [
    "matplotlib>=3.8,<3.9; python_version < '3.11'",
    "mediapipe==0.10.9; python_version < '3.11'",
    "mediapipe-model-maker==0.2.1.4; python_version < '3.11'",
    "setuptools<81; python_version < '3.11'",
    "tensorflow-metadata==1.14.0; python_version < '3.11'",
]
